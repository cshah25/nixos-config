name: Check flake

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluate every host without building it (full builds don't fit on free runners)
      - name: Evaluate hosts
        run: nix flake check --no-build
