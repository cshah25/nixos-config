# ────────────── Visual Theme Configuration ──────────────

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    # Modern indigo/blue gradient
    col.active_border = rgba(7c4dffea) rgba(00b0ffea) 45deg
    col.inactive_border = rgba(2d2d3dee)

    layout = dwindle
    
    # Enable resizing by dragging borders
    resize_on_border = true
    extend_border_grab_area = 15
}

decoration {
    rounding = 20

    active_opacity = 1.0
    inactive_opacity = 0.95

    drop_shadow = true
    shadow_range = 12
    shadow_render_power = 3
    col.shadow = rgba(1a1a24ee)

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
