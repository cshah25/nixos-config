# ────────────── Window and Layer Rules ──────────────

# Float all steam windows except the main one
windowrule = match:class ^(steam)$, float 1
windowrule = match:class ^(steam)$, match:title ^(Steam)$, tile 1
windowrule = match:class ^(steam)$, match:title ^(notificationtoasts_.*)$, float 1
windowrule = match:class ^(steam)$, match:title ^(notificationtoasts_.*)$, no_focus 1

# Picture-in-picture
windowrule = match:title ^(Picture-in-Picture)$, float 1
windowrule = match:title ^(Picture-in-Picture)$, pin 1

# Common dialogs and tools
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1
windowrule = match:class ^(file-roller)$, float 1
windowrule = match:class ^(org.gnome.Nautilus)$, float 1

# Xwayland video bridge (prevents black screen on sharing)
windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 override 0.0 override
windowrule = match:class ^(xwaylandvideobridge)$, no_anim 1
windowrule = match:class ^(xwaylandvideobridge)$, no_initial_focus 1
windowrule = match:class ^(xwaylandvideobridge)$, max_size 1 1
windowrule = match:class ^(xwaylandvideobridge)$, no_blur 1
