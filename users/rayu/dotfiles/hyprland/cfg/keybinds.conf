# ────────────── Keybindings Configuration ──────────────

# Main Modifier Key (Super/Windows key)
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod CTRL, RETURN, exec, noctalia-shell ipc call launcher toggle
bind = $mainMod, B, exec, zen
bind = $mainMod SHIFT, B, exec, brave
bind = $mainMod, L, exec, noctalia-shell ipc call lockScreen lock
bind = $mainMod, C, exec, code
bind = $mainMod, E, exec, nautilus -w

# Audio, Media & Brightness Controls (working even when locked)
bindel = , XF86AudioRaiseVolume, exec, noctalia-shell ipc call volume increase
bindel = , XF86AudioLowerVolume, exec, noctalia-shell ipc call volume decrease
bindl = , XF86AudioMute, exec, noctalia-shell ipc call volume muteOutput
bindl = , XF86AudioMicMute, exec, noctalia-shell ipc call volume muteInput
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86PowerOff, exec, noctalia-shell ipc call lockScreen lock

# Window Management
bind = $mainMod, Q, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen, 0

# Focus Movement
bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d

# Move Window
bind = $mainMod CTRL, LEFT, movewindow, l
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, RIGHT, movewindow, r
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, UP, movewindow, u
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, DOWN, movewindow, d
bind = $mainMod CTRL, J, movewindow, d

# Monitor Focus & Movement
bind = $mainMod SHIFT, LEFT, focusmonitor, l
bind = $mainMod SHIFT, RIGHT, focusmonitor, r
bind = $mainMod SHIFT, UP, focusmonitor, u
bind = $mainMod SHIFT, DOWN, focusmonitor, d

bind = $mainMod SHIFT CTRL, LEFT, movewindow, mon:l
bind = $mainMod SHIFT CTRL, RIGHT, movewindow, mon:r
bind = $mainMod SHIFT CTRL, UP, movewindow, mon:u
bind = $mainMod SHIFT CTRL, DOWN, movewindow, mon:d

# Workspace Switch & Move (Page Down / Page Up)
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod CTRL, Page_Down, movetoworkspace, e+1
bind = $mainMod CTRL, Page_Up, movetoworkspace, e-1
bind = $mainMod, TAB, workspace, previous

# Workspace Switching (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace (1 - 9)
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9

# Mouse Bindings (Drag to Move / Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Session Menu
bind = $mainMod SHIFT, Q, exec, noctalia-shell ipc call sessionMenu toggle
bind = CTRL ALT, DELETE, exec, noctalia-shell ipc call sessionMenu toggle

# Screenshots (using grim/slurp if available)
bind = $mainMod SHIFT, 1, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, 2, exec, grim - | wl-copy
bind = $mainMod SHIFT, 3, exec, grim -g "$(slurp -active)" - | wl-copy

# ─── Niri-Specific Feature Translations ───

# Layout maximizing (Niri's Mod+CTRL+F: expand-column-to-available-width)
bind = $mainMod CTRL, F, fullscreen, 1

# Tabbed/Group view (Niri's Mod+W: toggle-column-tabbed-display)
bind = $mainMod, W, togglegroup

# Monitor Power (Niri's Mod+Shift+P: power-off-monitors)
bind = $mainMod SHIFT, P, exec, hyprctl dispatch dpms off

# Focus First/Last Window (Niri's Mod+Home/End)
bind = $mainMod, HOME, focuswindow, first
bind = $mainMod, END, focuswindow, last

# Move Window to First/Last (Niri's Mod+Ctrl+Home/End)
bind = $mainMod CTRL, HOME, movewindow, l
bind = $mainMod CTRL, END, movewindow, r

# Scroll Wheel Focus (Niri's Mod+WheelScrollRight/Left)
bind = $mainMod, mouse_down, movefocus, r
bind = $mainMod, mouse_up, movefocus, l
bind = $mainMod CTRL, mouse_down, movewindow, r
bind = $mainMod CTRL, mouse_up, movewindow, l

# Page Up / Page Down Focus (Niri's Mod+Shift+Page_Up/Down)
bind = $mainMod SHIFT, Page_Up, movefocus, l
bind = $mainMod SHIFT, Page_Down, movefocus, r
bind = $mainMod SHIFT CTRL, Page_Up, movewindow, l
bind = $mainMod SHIFT CTRL, Page_Down, movewindow, r

# Window Resizing (Niri's Mod+Minus/Equal)
binde = $mainMod, minus, layoutmsg, splitratio -0.1
binde = $mainMod, equal, layoutmsg, splitratio +0.1
