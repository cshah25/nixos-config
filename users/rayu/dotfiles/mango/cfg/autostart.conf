# ─── Startup Applications ───
# Session setup: propagate env vars, activate session target, restart portals.
# This MUST complete before apps that need portals (equibop, browsers, etc.).
exec-once=sh -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user reset-failed && systemctl --user start mango-session.target && sleep 2 && systemctl --user restart xdg-desktop-portal-wlr xdg-desktop-portal-gtk xdg-desktop-portal'

# Noctalia Desktop Shell
exec-once=noctalia

# Equibop — delay until portals are ready for screen sharing
exec-once=sh -c 'sleep 5 && equibop'

# Wayland Pipewire Idle Inhibit
exec-once=wayland-pipewire-idle-inhibit
