# ─── Window & Layer Rules ───

# Full opacity for media/browsers/editor
windowrule=appid:zen,focused_opacity:1.0,unfocused_opacity:0.90
windowrule=appid:code,focused_opacity:1.0,unfocused_opacity:0.90
windowrule=appid:firefox,focused_opacity:1.0,unfocused_opacity:0.90
windowrule=appid:equibop,focused_opacity:1.0,unfocused_opacity:0.90

