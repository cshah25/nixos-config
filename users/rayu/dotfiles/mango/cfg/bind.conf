# ─── Keybindings ───
# Modifier: SUPER (Windows / Mod key)

# ─── Noctalia Shell Integration ───
bind=SUPER+CTRL,Return,spawn,noctalia msg panel-toggle launcher
bind=SUPER+ALT,L,spawn,noctalia msg session lock
bind=SUPER,Escape,spawn,noctalia msg session lock
bind=SUPER+SHIFT,Q,spawn,noctalia msg panel-toggle control-center
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-toggle control-center

# ─── Audio & Media Controls (Noctalia IPC & brightnessctl/playerctl) ───
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +10%
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# ─── Applications ───
bind=SUPER,Return,spawn,alacritty
bind=SUPER,B,spawn,xdg-open http://
bind=SUPER,C,spawn,code
bind=SUPER,E,spawn,nautilus -w

# ─── Window Actions ───
bind=SUPER,Q,killclient
bind=SUPER,T,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER,W,toggletabbed
bind=SUPER,Space,switch_layout
bind=SUPER,R,reload_config
bind=SUPER+SHIFT,P,dpms,toggle

# ─── Mouse: Super+drag to move / right-drag to resize floating windows ───
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ─── Directional Focus (Arrow keys & Vim HJKL) ───
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down
bind=SUPER,Home,focusdir,left
bind=SUPER,End,focusdir,right

# ─── Window Movement / Swap (Arrow keys & Vim HJKL) ───
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+CTRL,J,exchange_client,down

# ─── Scroller: Proportions ───
bind=SUPER,Equal,switch_proportion_preset
bind=SUPER+CTRL,Minus,set_proportion,0.5
bind=SUPER+SHIFT,Minus,set_proportion,0.8
bind=SUPER+CTRL,F,set_proportion,1.0

# ─── Monitor Focus & Movement ───
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down

# ─── Tags / Workspaces (1–9) ───
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

bind=SUPER,Tab,view,prev

# ─── Screenshots (Grim & Slurp) ───
bind=SUPER+SHIFT,1,spawn,grim - | wl-copy
bind=SUPER+SHIFT,2,spawn,grim -g "$(slurp)" - | wl-copy
bind=SUPER+SHIFT,3,spawn,mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot_$(date +'%Y%m%d_%H%M%S').png
