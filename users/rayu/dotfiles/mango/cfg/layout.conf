# ─── Layout & Window Appearance ───
# Window Gaps (8px matching Niri)
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8

# Window Borders & Corner Radius (5px matching Niri)
border_px=1
border_radius=5

# Theme Colors
focus_color=0x7aa2f7ff
border_color=0x1a1b26ff
root_color=0x1a1b26ff

# Opacity
# focused_opacity=0.95
# unfocused_opacity=0.85

# Default Layout across all tags
tag_rule=id:*,layout_name:scroller

# Layouts to cycle through with Super+Space
circle_layout=scroller,fair
