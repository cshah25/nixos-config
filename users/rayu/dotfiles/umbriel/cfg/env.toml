# ─── Environment Variables & Visual Effects ───
# XDG_CURRENT_DESKTOP / XDG_SESSION_TYPE / XDG_SESSION_DESKTOP are set by Umbriel itself
# Changes here need an Umbriel restart
[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "gtk3"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"

[general]
# Skip the keybind cheatsheet popup on every login
show_cheatsheet = false

# ─── Blur (Mango blur_params_*) ───
# Windows opt in via the window_rule in rules.toml; layers (blur_layer=0) don't
[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.0

# Mango shadows were commented out
[appearance.shadow]
enabled = false
# softness = 12
# offset_x = 2
# offset_y = 2

# layer_animations=0
[animation.layers]
enabled = false
