# ─── Input Devices ───
# Keyboard
[input.keyboard]
numlock_toggle = true

# Touchpad
[input.touchpad]
tap = true
natural_scroll = true
accel_profile = "flat"
sensitivity = 0.0

# Focus the window under the pointer
[input.focus]
follows_mouse = true

# Mouse
[input.mouse]
accel_profile = "flat"
sensitivity = 0.0
natural_scroll = false
