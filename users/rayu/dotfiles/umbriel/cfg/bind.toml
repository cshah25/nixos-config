# ─── Keybindings ───
# Modifier: Mod = SUPER (Windows / Mod key)
# Defining [keybinds] replaces Umbriel's built-in set, so only these exist.
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# ─── Noctalia Shell Integration ───
"Mod+Ctrl+Return" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Alt+L" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Escape" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Shift+Q" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Ctrl+Alt+Delete" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }

# ─── Audio & Media Controls (Noctalia IPC & brightnessctl/playerctl) ───
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl s 10%-", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn brightnessctl s +10%", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn playerctl next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn playerctl previous", allow_when_locked = true, repeat = false }

# ─── Applications ───
"Mod+Return" = { action = "spawn alacritty", repeat = false }
"Mod+B" = { action = "spawn xdg-open http://", repeat = false }
"Mod+C" = { action = "spawn code", repeat = false }
"Mod+E" = { action = "spawn thunar -w", repeat = false }

# ─── Window Actions ───
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
# "Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Space" = { action = "workspace-set-layout toggle scrolling dwindle", repeat = false }
"Mod+R" = { action = "config-reload", repeat = false }
# "Mod+Shift+P" = "dpms-off"

# ─── Mouse: Super+drag to move / right-drag to resize ───
# Built into Umbriel (Mod+left-drag moves, Mod+right-drag resizes), no binds needed

# ─── Directional Focus (Arrow keys & Vim HJKL) ───
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+Home" = "window-focus-left"
"Mod+End" = "window-focus-right"

# ─── Window Movement / Swap (Arrow keys & Vim HJKL) ───
"Mod+Ctrl+Left" = "window-swap-left"
"Mod+Ctrl+Right" = "window-swap-right"
"Mod+Ctrl+Up" = "window-swap-up"
"Mod+Ctrl+Down" = "window-swap-down"
"Mod+Ctrl+H" = "window-swap-left"
"Mod+Ctrl+L" = "window-swap-right"
"Mod+Ctrl+K" = "window-swap-up"
"Mod+Ctrl+J" = "window-swap-down"

# ─── Scroller: Proportions ───
"Mod+Equal" = "window-cycle-primary-extent"
"Mod+Ctrl+Minus" = "window-set-primary-extent 0.5"
"Mod+Shift+Minus" = "window-set-primary-extent 0.8"
"Mod+Ctrl+F" = "window-set-primary-extent 1.0"

# ─── Monitor Focus & Movement ───
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Ctrl+Left" = "window-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "window-move-to-output-right"
"Mod+Shift+Ctrl+Up" = "window-move-to-output-up"
"Mod+Shift+Ctrl+Down" = "window-move-to-output-down"

# ─── Workspaces (1–9) ───
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"Mod+Ctrl+1" = "window-move-to-workspace 1"
"Mod+Ctrl+2" = "window-move-to-workspace 2"
"Mod+Ctrl+3" = "window-move-to-workspace 3"
"Mod+Ctrl+4" = "window-move-to-workspace 4"
"Mod+Ctrl+5" = "window-move-to-workspace 5"
"Mod+Ctrl+6" = "window-move-to-workspace 6"
"Mod+Ctrl+7" = "window-move-to-workspace 7"
"Mod+Ctrl+8" = "window-move-to-workspace 8"
"Mod+Ctrl+9" = "window-move-to-workspace 9"

"Mod+Tab" = "workspace-focus-last"

# ─── Overview (same as the 4-finger swipe) ───
"Mod+O" = { action = "overview-toggle", repeat = false }

# ─── Screenshots (Noctalia) ───
"Mod+Shift+1" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Shift+2" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Mod+Shift+3" = { action = "spawn noctalia msg screenshot-fullscreen all", repeat = false }
"Mod+Shift+4" = { action = "spawn noctalia msg screenshot-fullscreen pick", repeat = false }

# ─── Touchpad Gestures ───
# Built in and not rebindable: 3-finger left/right scrolls the column strip,
# 3-finger up/down switches workspace, 4-finger opens the overview.
